name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check every JS file
        run: |
          fail=0
          for f in $(find js mods tools . -maxdepth 3 -name '*.js' -not -path './.git/*'); do
            node --check "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          exit $fail

      - name: Validate JSON files
        run: |
          fail=0
          for f in $(find . -name '*.json' -not -path './.git/*' -not -path './node_modules/*'); do
            python3 -m json.tool "$f" > /dev/null || { echo "JSON FAIL: $f"; fail=1; }
          done
          exit $fail

      - name: Run test suites
        run: |
          # The engine-only repo ships no node test suites (test6/7/8.js went with
          # the game content); run any that are present so this never goes stale.
          found=0
          for t in test6.js test7.js test8.js; do
            if [ -f "$t" ]; then echo "running $t"; node "$t"; found=1; fi
          done
          [ "$found" -eq 1 ] || echo "no node test suites present in this repo"

      - name: Static audit (repo root)
        run: python3 tools/static-audit.py .
