<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Aethelgard Engine</title>
<meta name="description" content="Page not found — Aethelgard Engine.">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<style>
  :root{--bg:#14161a;--panel:#1a1d23;--line:#2b3039;--text:#c9d1d9;--muted:#8b949e;--accent:#60a5fa;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
    font-family:var(--sans);padding:24px}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:linear-gradient(rgba(96,165,250,.04) 1px,transparent 1px) 0 0/100% 34px,
               linear-gradient(90deg,rgba(96,165,250,.04) 1px,transparent 1px) 0 0/34px 100%}
  .box{position:relative;max-width:560px;width:100%;background:var(--panel);border:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line);
    background:#101216;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .bar .sq{width:9px;height:9px;border:1px solid #363c46;display:inline-block}
  .bar .spacer{margin-left:auto}
  .in{padding:30px 26px 30px}
  .code{font-family:var(--mono);color:var(--accent);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px}
  h1{font-size:1.5rem;margin:0 0 10px;color:#eef2f7;letter-spacing:-.01em}
  p{color:var(--muted);margin:0 0 20px;line-height:1.65}
  a.btn{display:inline-flex;align-items:center;gap:9px;padding:11px 16px;border:1px solid var(--accent);
    color:#dbeafe;background:rgba(96,165,250,.12);font-family:var(--mono);font-size:13px;text-decoration:none}
  a.btn:hover{background:rgba(96,165,250,.2)}
  .links{margin-top:18px;font-family:var(--mono);font-size:12.5px;display:flex;flex-wrap:wrap;gap:14px}
  .links a{color:var(--muted);text-decoration:none}
  .links a:hover{color:var(--accent)}
</style>
</head>
<body>
  <div class="box">
    <div class="bar"><span class="sq"></span><span>404</span><span class="spacer"></span><span>aethelgard-engine</span></div>
    <div class="in">
      <p class="code">error 404 · route not found</p>
      <h1>This panel has no view.</h1>
      <p>The page you asked for is not part of the Aethelgard Engine site. It may have moved, or the path may be wrong.</p>
      <a class="btn" href="/Aethelgard-Engine/">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to the landing page
      </a>
      <div class="links">
        <a href="/Aethelgard-Engine/play/">Play the demo</a>
        <a href="https://github.com/drsamonline/Aethelgard-Engine">Repository</a>
      </div>
    </div>
  </div>
</body>
</html>
